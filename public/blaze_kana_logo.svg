<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <style>
      .bg-color { fill: #0b0b0c; }
      .text-primary { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #ffffff; letter-spacing: 0.12em; }
      .text-accent { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #ff5700; letter-spacing: 0.18em; }
      .kanji-caption { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; fill: #888890; letter-spacing: 0.35em; font-size: 14px; }
      .flame-orange { fill: #ff5700; }
      .flame-light { fill: #ff8533; }
      .flame-white { fill: #ffffff; }
      .flame-dark { fill: #cc4400; }
    </style>
  </defs>

  <!-- VERSION 1: HORIZONTAL WORDMARK LOGO -->
  <g id="horizontal-logo" transform="translate(60, 60)">
    
    <!-- Icon Symbol (Left) -->
    <g id="symbol" transform="translate(0, 0)">
      <!-- Outer Flame / あ Silhouette Background Base -->
      <path class="flame-orange" d="M100,10 C130,50 145,85 140,130 C136,165 112,190 85,200 C58,190 35,165 30,130 C25,85 50,45 100,10 Z" />
      
      <!-- Inner Dynamic Flame Cutout / Negative Space & Flame Integration -->
      <path class="bg-color" d="M95,35 C115,65 125,95 120,130 C116,155 100,175 80,185 C65,175 50,155 45,130 C42,95 65,65 95,35 Z" />

      <!-- Stylized Hiragana "あ" Core Stroke Elements combined with Flame -->
      <path class="flame-white" d="M60,65 Q100,55 125,75 Q115,65 95,65 Z" />
      <path class="flame-white" d="M72,82 C85,80 102,88 100,105 C98,122 75,115 70,100 C68,92 70,85 72,82 Z" />
      <path class="bg-color" d="M82,92 C88,90 92,96 90,102 C88,107 80,105 78,100 C77,96 79,93 82,92 Z" />

      <!-- Center Vertical Crossing Stroke & Swirling Flame Tail -->
      <path class="flame-white" d="M88,55 C90,100 82,145 68,180 C60,198 42,215 22,225 C45,210 62,190 70,165 C78,135 80,95 78,55 Z" />

      <!-- Right Hook / Loop of "あ" morphing into an upward spark/flame -->
      <path class="flame-light" d="M105,130 C125,132 142,148 135,175 C128,198 102,210 85,215 C108,205 125,188 122,165 C120,148 112,138 105,130 Z" />
      
      <!-- Accent Spark Top -->
      <polygon class="flame-white" points="100,0 106,18 100,24 94,18" />
    </g>

    <!-- Typography (Right) -->
    <g id="wordmark" transform="translate(225, 115)">
      <!-- Main Brand Name -->
      <text x="0" y="0" font-size="52" class="text-primary">BLAZE<tspan class="text-accent"> KANA</tspan></text>
      
      <!-- Subtitle / Tagline -->
      <text x="3" y="32" class="kanji-caption">JAPANESE LEARNING PLATFORM</text>
    </g>
  </g>

  <!-- VERSION 2: ICON-ONLY MARK (Bottom Right) -->
  <g id="icon-only" transform="translate(930, 260)">
    <g transform="translate(-70, -110) scale(0.9)">
      <path class="flame-orange" d="M100,10 C130,50 145,85 140,130 C136,165 112,190 85,200 C58,190 35,165 30,130 C25,85 50,45 100,10 Z" />
      <path class="bg-color" d="M95,35 C115,65 125,95 120,130 C116,155 100,175 80,185 C65,175 50,155 45,130 C42,95 65,65 95,35 Z" />
      <path class="flame-white" d="M60,65 Q100,55 125,75 Q115,65 95,65 Z" />
      <path class="flame-white" d="M72,82 C85,80 102,88 100,105 C98,122 75,115 70,100 C68,92 70,85 72,82 Z" />
      <path class="bg-color" d="M82,92 C88,90 92,96 90,102 C88,107 80,105 78,100 C77,96 79,93 82,92 Z" />
      <path class="flame-white" d="M88,55 C90,100 82,145 68,180 C60,198 42,215 22,225 C45,210 62,190 70,165 C78,135 80,95 78,55 Z" />
      <path class="flame-light" d="M105,130 C125,132 142,148 135,175 C128,198 102,210 85,215 C108,205 125,188 122,165 C120,148 112,138 105,130 Z" />
      <polygon class="flame-white" points="100,0 106,18 100,24 94,18" />
    </g>
  </g>
</svg>
